# Configuration for the Baits GUI, shown after clicking the baits button in /emf gui.

title: <#006F86>EvenMoreFish - Baits
# Items are placed by slot number, starting at 0 in the top left. A slot can be a number,
# a range like "10-16", or a list of those. Empty slots get the filler item.
rows: 5
# Decorative fillers from gui-fillers.yml, by slot.
fillers:
  light_blue_stained_glass_pane: [2, 4, 6, 9, 17, 27, 35, 38, 42]
  cyan_stained_glass_pane: [3, 5, 10, 16, 28, 34, 39, 41]
  gray_stained_glass_pane: [12, 14, 18, 26, 30, 32]
filler: black_stained_glass_pane
# The slots to use for the bait items.
bait-slots: ["20-24"]

# How to sort the baits. Valid options are: alphabetical, index. (Default: alphabetical)
sort-type: alphabetical

# The lore to use when a bait can be purchased.
# Supported variables: {quantity}, {price}, {bait}
purchase-lore:
  - Click to purchase {quantity}x {bait} for {price}

# The lore to use when a bait can be bought with fishing skill points ("purchase.skill-points" in the bait file).
# When a bait can be bought both ways, right-click pays with skill points.
# Supported variables: {quantity}, {points}, {bait}
purchase-points-lore:
  - "<yellow>Click to buy {quantity}x {bait} for <aqua>{points} skill points"

exit:
  item:
    material: pufferfish
    displayname: <red>Exit
    lore:
      - <yellow>Exit to the Menu
  glowing: true
  slot: 40
  click-action: open-main-menu

# Page Buttons
next-page:
  item:
    material: paper
    displayname: <aqua>Next Page
    lore:
      - <yellow>Go to the next page
  fallback-item:
    material: barrier
    displayname: <aqua>Next Page
    lore:
      - <yellow>You are on the last page
  slot: 44
  page-action: next

last-page:
  item:
    material: arrow
    displayname: <aqua>Last Page
    lore:
      - <yellow>Go to the last page
  fallback-item:
    material: barrier
    displayname: <aqua>Last Page
    lore:
      - <yellow>You are on the last page
  page-action: last

previous-page:
  item:
    material: paper
    displayname: <aqua>Previous Page
    lore:
      - <yellow>Go to the previous page
  fallback-item:
    material: barrier
    displayname: <aqua>Previous Page
    lore:
      - <yellow>You are on the first page
  slot: 36
  page-action: previous

first-page:
  item:
    material: arrow
    displayname: <aqua>First Page
    lore:
      - <yellow>Go to the first page
  fallback-item:
    material: barrier
    displayname: <aqua>First Page
    lore:
      - <yellow>You are on the first page
  page-action: first

# ATTENTION ATTENTION ATTENTION
# DO NOT EDIT THIS VALUE OR THINGS WILL BREAK!!!
version: 1