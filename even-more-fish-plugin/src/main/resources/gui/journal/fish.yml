# Configuration for the Journal GUI, shown after clicking the journal button in /emf gui, after selecting a rarity.

title: <#006F86>EvenMoreFish - Fish Journal
# Items are placed by slot number, starting at 0 in the top left. A slot can be a number,
# a range like "10-16", or a list of those. Empty slots get the filler item.
rows: 6
filler: gray_stained_glass_pane
# The slots to use for fish items
fish-slots: ["10-16", "19-25", "28-34", "37-43"]

# How to sort the fish. Valid options are: alphabetical, weight, index. (Default: alphabetical)
sort-type: alphabetical

# Whether to show the undiscovered-fish config below when a fish has not been caught by the player.
hide-undiscovered-fish: false

# The message to display when a fish has no data.
# This does not support formatting.
unknown-message: "Unknown"

# How undiscovered fish should look
undiscovered-fish:
  item:
    material: iron_bars
    displayname: <dark_gray>Undiscovered Fish
  lore:
    - ''
    - <white>Catch this fish
    - <white>to unlock it here.

# How caught fish should look. Changing the material will not work, as it always uses the fish item as a base
fish-item:
  item:
    displayname: <white>{fishname}
    lore:
      - ''
      - '<gold>Information'
      - '<gray>▸ Tier: {rarity}'
      - '<gray>▸ Size: <aqua>{size-range}'
      - '<gray>▸ Price: <green>{price}'
      - '<gray>▸ Biomes: <red>{biomes}'
      - ''
      - '<white>Caught: {times-caught}x'
      - '<white>Largest Size: {largest-size}cm'
      - '<white>Smallest Size: {smallest-size}cm'
      - '<white>Found: {discover-date}'
      - ''
      - '<white>Discovered by: {discoverer}'
      - '<white>Server Largest: {server-largest}cm'
      - '<white>Server Smallest: {server-smallest}cm'
      - '<white>Server Caught: {server-caught}x'

rarity-item:
  item:
    displayname: <white>{rarityname}

info:
  item:
    material: book
    displayname: <red>Information
    lore:
      - <yellow>This page shows all the {rarity} fish you have caught.
  slot: 4

exit:
  item:
    material: pufferfish
    displayname: <red>Exit
    lore:
      - <yellow>Exit to the Menu
  glowing: true
  slot: 49
  click-action: open-journal-menu

# Page Buttons
next-page:
  item:
    material: paper
    displayname: <aqua>Next Page
    lore:
      - <yellow>Go to the next page
  fallback-item:
    material: barrier
    displayname: <aqua>Next Page
    lore:
      - <yellow>You are on the last page
  slot: 53
  page-action: next

last-page:
  item:
    material: arrow
    displayname: <aqua>Last Page
    lore:
      - <yellow>Go to the last page
  fallback-item:
    material: barrier
    displayname: <aqua>Last Page
    lore:
      - <yellow>You are on the last page
  page-action: last

previous-page:
  item:
    material: paper
    displayname: <aqua>Previous Page
    lore:
      - <yellow>Go to the previous page
  fallback-item:
    material: barrier
    displayname: <aqua>Previous Page
    lore:
      - <yellow>You are on the first page
  slot: 45
  page-action: previous

first-page:
  item:
    material: arrow
    displayname: <aqua>First Page
    lore:
      - <yellow>Go to the first page
  fallback-item:
    material: barrier
    displayname: <aqua>First Page
    lore:
      - <yellow>You are on the first page
  slots: ["10-16", "19-25", "28-34", "37-43"]
  page-action: first

# ATTENTION ATTENTION ATTENTION
# DO NOT EDIT THIS VALUE OR THINGS WILL BREAK!!!
version: 1