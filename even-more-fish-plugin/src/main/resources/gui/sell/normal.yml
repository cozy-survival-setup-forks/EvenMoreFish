# Configuration for the normal Sell GUI, shown when /emf shop is used, before clicking a sell button.

title: <#006F86>EvenMoreFish - Sell Fish
# Items are placed by slot number, starting at 0 in the top left. A slot can be a number,
# a range like "10-16", or a list of those. Empty slots get the filler item.
rows: 4
filler: light_blue_stained_glass_pane
# The slots to use for the slots where players can place fish.
deposit-slots: ["0-26"]

sell-item:
  item:
    material: GOLD_INGOT
    displayname: <bold><gold>Sell
    lore:
      - <dark_gray>Fish Shop
      - ''
      - <gray>Click this button to sell all
      - <gray>the fish inside the shop menu.
      - ''
      - <yellow>» (Left-click) sell the fish.
      - <gray>» (Right-click) cancel.
  slot: 30
  click-action:
    left: sell-shop
    right: full-exit

sell-all-item:
  item:
    material: COD_BUCKET
    displayname: <bold><gold>Sell All
    lore:
      - <dark_gray>Inventory
      - ''
      - <gray>Click this button to sell all
      - <gray>the fish in your inventory.
      - ''
      - <yellow>» (Left-click) sell the fish.
      - <gray>» (Right-click) cancel.
  slot: 32
  click-action:
    left: sell-inventory
    right: full-exit

# Shows what each rarity of fish is worth. {price} is the average base worth of a fish of that rarity.
prices:
  slot: 27
  material: emerald
  title: "<green><bold>PRICES"
  lines:
    - "<gray>Fishing"
    - ""
    - "<gold>Information"
  rarity-line: "<gray>▸ {rarity}<gray>: <green>{price}"

# Shows the special fish, which sells for a bonus until the timer runs out. See progression.yml.
special-fish:
  slot: 35
  title: "<red><bold>SPECIAL FISH"
  lines:
    - "<gray>Fishing"
    - ""
    - "<gold>Information"
    - "<gray>Fish: <yellow>{fish}"
    - "<gray>Tier: <aqua>{tier}"
    - "<gray>Multiplier: <light_purple>{multiplier}x"
    - ""
    - "<red>Resets in <yellow>{minutes} minutes<red>."

# ATTENTION ATTENTION ATTENTION
# DO NOT EDIT THIS VALUE OR THINGS WILL BREAK!!!
version: 2