# Configuration for the Skill Tree GUI, shown from the Stats menu or with /emf skills.
# The skills themselves (names, costs, effects) are set up in progression.yml.
# Text is MiniMessage. Placeholders in {curly braces} are filled in by the plugin.

title: <#006F86>Fishing | Skill Tree
# Items are placed by slot number, starting at 0 in the top left. A slot can be a number,
# a range like "10-16", or a list of those. Empty slots get the filler item.
rows: 4
filler: gray_stained_glass_pane

summary:
  slot: 4
  material: experience_bottle
  title: "<aqua><bold>SKILL TREE"
  lines:
    - "<gray>Fishing"
    - ""
    - "<gray>▸ Level: <aqua>{level}"
    - "<gray>▸ Skill Points: <aqua>{skill-points}"
    - "<gray>▸ Current XP: <aqua>{xp-into-level}"
    - "<gray>▸ Required XP: <aqua>{xp-required}"

skill:
  slots: ["11-15", "20-24"]
  title: "<yellow><bold>{name}"
  lines:
    - "<gray>Fishing"
    - ""
    - "<gray>{description}"
    - ""
    - "<gray>▸ Level: <yellow>{level}<gray>/<yellow>{max-level}"
    - "<gray>▸ Now: <green>{current-effect}"
    - "<gray>▸ Per level: <green>{per-level-effect}"
    - "<gray>▸ Cost: <aqua>{cost} skill point(s)"
    - ""
  buy-line: "<yellow>» Click to upgrade."
  maxed-line: "<green>Fully upgraded!"
  # What each kind of skill does. {bonus} is replaced with the number.
  effects:
    sell-bonus: "+{bonus}% money from fish"
    xp-boost: "+{bonus}% fishing XP"
    special-boost: "+{bonus}x special fish multiplier"
    fast-bite: "{bonus}% faster bites"
    double-catch: "{bonus}% chance of an extra fish"

messages:
  bought: "<green>You upgraded <yellow>{name}<green>!"
  maxed: "<red>{name} is already fully upgraded."
  not-enough-points: "<red>You do not have enough skill points for {name}."
  unknown: "<red>That skill no longer exists."

exit:
  item:
    material: pufferfish
    displayname: <red>Back
    lore:
      - <yellow>Back to your stats
  glowing: true
  slot: 31
  click-action: open-stats-menu

# ATTENTION ATTENTION ATTENTION
# DO NOT EDIT THIS VALUE OR THINGS WILL BREAK!!!
version: 2
